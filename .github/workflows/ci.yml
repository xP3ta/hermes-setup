name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Nightly, against whatever the current upstream Hermes is: the jobs that
  # install it for real (macOS, Linux) are the only ones that notice when
  # upstream changes its layout. A failed scheduled run is mailed to the
  # repository owner by GitHub; nothing else is notified.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  unix:
    name: Unix syntax, lint, release and bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate POSIX and Bash syntax
        shell: bash
        run: |
          for script in hermes-mobile-setup.sh hermes-dashboard-setup.sh hermes-pair.sh; do
            sh -n "$script"
          done
          for script in tests/bootstrap-unix_test.sh; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          # These exclusions cover pre-existing parser false positives/intentional
          # portability idioms in the runtime scripts.
          shellcheck --severity=warning \
            --exclude=SC1007,SC1087,SC2015,SC2221,SC2222 \
            hermes-mobile-setup.sh hermes-dashboard-setup.sh hermes-pair.sh
          # The POSIX harness sources functions generated at runtime.
          shellcheck --severity=warning --exclude=SC1007,SC2034 \
            tests/bootstrap-unix_test.sh

      - name: Verify CI contract
        shell: bash
        run: |
          python3 tests/ci_workflow_test.py
          python3 tests/ci-parse-closure_test.py
          python3 tests/bootstrap-isolation_test.py
          python3 tests/checkout-integrity_test.py

      # Product-level contract suites: systemd/launchd unit safety, lock and
      # home identity, authenticated redirects, negative auth probes, rollback.
      - name: Review suites (Unix)
        shell: bash
        run: python3 tests/review-unix-security.py

      # Setup without the Mobile Bridge: the Dashboard sign-in decision, the
      # code that carries it, --retire-bridge, and a whole setup against a
      # stand-in Hermes in a disposable home (nothing is installed or fetched).
      - name: Setup without the Mobile Bridge
        shell: bash
        run: |
          python3 tests/no-bridge_test.py
          python3 tests/no-bridge-install_test.py
          python3 tests/new-hermes-layout_test.py
          python3 tests/installer-lifecycle_test.py

      # LEGACY, removed with Console 1.2.17. The Mobile Bridge is no longer
      # installed, but its file and manifest stay published for apps older than
      # 1.2.15 that still update a bridge they already have: the manifest must
      # describe the exact bytes, and the handlers keep their own suite.
      # Dashboard-only setup (hermes-dashboard-setup.sh): the thin complement to
      # the official Hermes installer. Sign-in decision against Hermes' own
      # registry calls, one bind address, rollback, --new-access, and the two
      # cleanups (--retire-gateway-exposure, --retire-bridge), in disposable
      # homes with a stand-in Hermes (nothing is installed or fetched).
      - name: Dashboard-only setup
        shell: bash
        run: python3 tests/dashboard-only_test.py

      - name: Legacy (bridge-era installs) - manifest, handlers, old installs
        shell: bash
        run: |
          python3 tests/legacy-bridge-release_test.py
          python3 tests/legacy-bridge-coexistence_test.py
          python3 -m pip install --quiet --disable-pip-version-check aiohttp pyyaml
          python3 tests/legacy-bridge-security_test.py

      - name: Run Unix tests
        shell: bash
        run: |
          bash tests/bootstrap-unix_test.sh

  macos:
    name: macOS native (launchd)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Diagnostico: si /bin/sh (bash 3.2 en macOS) no parsea, identifica el
      # bloque culpable en lugar de obligar a adivinar desde el numero de linea.
      - name: Locate the offending block when /bin/sh refuses to parse
        shell: bash
        run: |
          for script in hermes-mobile-setup.sh hermes-dashboard-setup.sh hermes-pair.sh; do
            if ! sh -n "$script"; then
              echo "::warning::$script does not parse with /bin/sh; bisecting"
              python3 tests/sh_parse_bisect.py /bin/sh || true
            fi
          done

      - name: Validate POSIX syntax on BSD userland
        shell: bash
        run: |
          for script in hermes-mobile-setup.sh hermes-dashboard-setup.sh hermes-pair.sh; do
            sh -n "$script"
          done

      - name: Run the contract suite on macOS
        shell: bash
        run: |
          python3 tests/review-unix-security.py
          python3 tests/no-bridge_test.py

      # launchd es otro gestor de servicios: se valida con `launchctl` real,
      # usando las propias funciones del instalador (plist, guardas de propiedad
      # y ciclo bootstrap/bootout), no una reimplementacion.
      - name: Native launchd lifecycle
        shell: bash
        run: python3 tests/macos-launchd_test.py

      # Instalacion completa y aislada con probes autenticados contra los dos
      # servicios, para que macOS deje de ser codigo sin evidencia nativa.
      - name: Native isolated install and authenticated probes
        shell: bash
        run: sh tests/macos-install_test.sh

  # Real, current upstream Hermes in a temporary HOME. Network by design, so
  # nightly and on demand only, never on a push.
  linux-real-install:
    name: Linux real install (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # A runner's job shell is not a login session: start the user's service
      # manager the way a normal Linux desktop or server login has it.
      - name: Start a user session with a service manager
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Isolated install of the current Hermes and authenticated probes
        shell: bash
        run: sh tests/linux-real-install_test.sh

  windows:
    name: Windows PowerShell 5.1 and 7
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Parse and test with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/powershell_test.ps1

      - name: Parse and test with PowerShell 7
        shell: pwsh
        run: ./tests/powershell_test.ps1

      # Native suite on a real Windows Server runner: Job Objects, Scheduled
      # Tasks, CIM inventory, firewall filters executable overrides and process
      # containment run for real here, with no portable skips.
      - name: Native review suite with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/review-windows.Tests.ps1 -Case All

      - name: Native review suite with PowerShell 7
        shell: pwsh
        run: ./tests/review-windows.Tests.ps1 -Case All
