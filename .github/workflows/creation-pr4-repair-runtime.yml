name: Creation PR4 repair runtime

on:
  push:
    branches:
      - patch/safe-setup-idempotency

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[creation-pr4-repair]')
    runs-on: windows-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: patch/safe-setup-idempotency

      - name: Apply maintainer feedback exactly
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          setup = Path("hermes-mobile-setup.ps1")
          source = setup.read_text(encoding="utf-8")

          replacements = [
              (
                  """    # Opt-in ONLY. When set, a timed-out installer is killed immediately (old\n    # behavior). Without it, the installer keeps running to completion in the\n    # background so a partially built venv is never left behind.\n""",
                  """    # Opt-in ONLY. When set, a timed-out installer is killed immediately (old\n    # behavior). Without it, the timeout is a soft warning threshold: setup\n    # keeps waiting while holding the single-flight lock until the installer\n    # actually exits, so a second setup cannot overlap the same venv mutation.\n""",
              ),
              (
                  """        # is now 900s (-InstallerTimeoutSec). On timeout WITHOUT -ForceClose\n        # the installer keeps running detached so it can finish rebuilding the\n        # venv; setup exits with guidance instead of corrupting the install.\n""",
                  """        # is now 900s (-InstallerTimeoutSec). On timeout WITHOUT -ForceClose,\n        # the threshold is informational: setup keeps waiting for the same\n        # installer while retaining .setup-lock. The lock is therefore never\n        # released while that installer can still be mutating the venv.\n""",
              ),
              (
                  """                if ($ForceClose) {\n                    try { $process.Kill() } catch {}\n                    throw \"Hidden installer timed out after ${InstallerTimeoutSec}s and was force-closed (-ForceClose): $(Get-PowerShellExecutable)\"\n                }\n                Write-Warn \"Hermes installer exceeded ${InstallerTimeoutSec}s; leaving it running detached to finish safely. Re-run this setup in a few minutes (it is idempotent). Logs: $outLog\"\n                throw \"Hermes installer still running after ${InstallerTimeoutSec}s. It was NOT killed; wait for completion and re-run setup.\"\n""",
                  """                if ($ForceClose) {\n                    try {\n                        $process.Kill()\n                        $process.WaitForExit()\n                    } catch {\n                        Write-Warn \"Force-close did not confirm installer exit; continuing to wait while the setup lock remains held.\"\n                        $process.WaitForExit()\n                    }\n                    throw \"Hidden installer timed out after ${InstallerTimeoutSec}s and was force-closed (-ForceClose): $(Get-PowerShellExecutable)\"\n                }\n                Write-Warn \"Hermes installer exceeded ${InstallerTimeoutSec}s; continuing to wait while the setup lock remains held. Logs: $outLog\"\n""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one patch target, found {count}")
              source = source.replace(old, new)

          setup.write_text(source, encoding="utf-8", newline="\n")

          test = r'''[CmdletBinding()]
          param(
              [string]$SetupScript = (Join-Path $PSScriptRoot "hermes-mobile-setup.ps1")
          )

          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Assert-True([bool]$Condition, [string]$Message) {
              if (-not $Condition) { throw "FAIL: $Message" }
              Write-Host "PASS: $Message"
          }

          function Test-ExclusiveAcquire([string]$Path) {
              try {
                  $stream = [IO.File]::Open($Path, 'OpenOrCreate', 'ReadWrite', 'None')
                  try { return $true } finally { $stream.Dispose() }
              } catch [IO.IOException] {
                  return $false
              }
          }

          if (-not (Test-Path -LiteralPath $SetupScript)) {
              throw "Setup script not found: $SetupScript"
          }

          $source = Get-Content -LiteralPath $SetupScript -Raw
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseInput(
              $source, [ref]$tokens, [ref]$parseErrors
          )
          Assert-True ($parseErrors.Count -eq 0) "hermes-mobile-setup.ps1 parses cleanly"

          $enterFn = $ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq "Enter-SetupLock"
          }, $true)
          $exitFn = $ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq "Exit-SetupLock"
          }, $true)
          $installFn = $ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq "Install-HermesIfNeeded"
          }, $true)

          Assert-True ($null -ne $enterFn) "Enter-SetupLock exists"
          Assert-True ($null -ne $exitFn) "Exit-SetupLock exists"
          Assert-True ($null -ne $installFn) "Install-HermesIfNeeded exists"

          $installText = $installFn.Extent.Text
          Assert-True (
              $installText -match "continuing to wait while the setup lock remains held"
          ) "default timeout path explicitly preserves lock ownership while waiting"
          Assert-True (
              $installText -notmatch "leaving it running detached"
          ) "default timeout path no longer detaches installer from lock owner"
          Assert-True (
              $installText -notmatch "Hermes installer still running after .*It was NOT killed"
          ) "default timeout path no longer throws while installer is still running"

          $temp = Join-Path ([IO.Path]::GetTempPath()) ("hermes-lock-review-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $lockPath = Join-Path $temp ".setup-lock"

          try {
              function Write-Audit([string]$Step, [string]$State, [string]$Detail = "") {}
              Invoke-Expression $enterFn.Extent.Text
              Invoke-Expression $exitFn.Extent.Text
              $script:SetupLock = $lockPath
              $script:SetupLockStream = $null

              Enter-SetupLock
              Assert-True ($null -ne $script:SetupLockStream) "setup retains the exclusive FileStream"
              Assert-True (-not (Test-ExclusiveAcquire $lockPath)) "second acquirer is blocked while setup lock is held"
              Exit-SetupLock
              Assert-True (Test-ExclusiveAcquire $lockPath) "Exit-SetupLock releases exclusivity"

              $stale = [IO.File]::Open($lockPath, 'OpenOrCreate', 'ReadWrite', 'None')
              $stale.Dispose()
              Assert-True (Test-ExclusiveAcquire $lockPath) "stale lock file does not deadlock the next run"

              $holderScript = Join-Path $temp "holder.ps1"
              $readyPath = Join-Path $temp "holder.ready"
              @'
          param([string]$LockPath, [string]$ReadyPath)
          $ErrorActionPreference = "Stop"
          $stream = [IO.File]::Open($LockPath, 'OpenOrCreate', 'ReadWrite', 'None')
          try {
              Set-Content -LiteralPath $ReadyPath -Value "ready" -Encoding ASCII
              Start-Sleep -Milliseconds 2600
          } finally {
              $stream.Dispose()
          }
          '@ | Set-Content -LiteralPath $holderScript -Encoding UTF8

              $hostExe = (Get-Process -Id $PID).Path
              $holder = Start-Process -FilePath $hostExe -ArgumentList @(
                  "-NoProfile",
                  "-File", $holderScript,
                  "-LockPath", $lockPath,
                  "-ReadyPath", $readyPath
              ) -PassThru

              $readyWatch = [Diagnostics.Stopwatch]::StartNew()
              while (-not (Test-Path -LiteralPath $readyPath) -and $readyWatch.Elapsed.TotalSeconds -lt 10) {
                  if ($holder.HasExited) {
                      throw "holder exited before acquiring the lock (exit $($holder.ExitCode))"
                  }
                  Start-Sleep -Milliseconds 50
              }
              Assert-True (Test-Path -LiteralPath $readyPath) "simulated first run signaled lock ownership"
              Assert-True (-not (Test-ExclusiveAcquire $lockPath)) "first run owns lock before timeout"

              Start-Sleep -Milliseconds 1100
              Assert-True (-not (Test-ExclusiveAcquire $lockPath)) "timeout followed by immediate second run remains blocked"

              $holder.WaitForExit()
              Assert-True ($holder.ExitCode -eq 0) "simulated long installer exits cleanly"
              Assert-True (Test-ExclusiveAcquire $lockPath) "second run can acquire only after installer completion"

              Write-Host "ALL PASS"
          } finally {
              try {
                  if ($script:SetupLockStream) { $script:SetupLockStream.Dispose() }
              } catch {}
              Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
          }
          '''
          Path("test-lock.ps1").write_text(textwrap.dedent(test), encoding="utf-8", newline="\n")

          notes = '''# Patch: safe-setup-idempotency

          ## Problem
          Repair mode could misclassify a transient health-probe failure as a broken install, then a slow hidden reinstall could collide with a second setup run. The first lock repair held an exclusive FileStream for setup, but the timeout path still threw while deliberately leaving the installer alive; the outer finally then released the lock before venv mutation ended.

          ## Corrected behavior
          1. **Idempotent health guard** — three retries plus `hermes_cli` import fallback before destructive reinstall.
          2. **Soft installer timeout** — `-InstallerTimeoutSec` defaults to 900s. Without `-ForceClose`, crossing the threshold only emits a warning; setup remains alive and continues waiting for the installer, so `.setup-lock` stays held until the process exits.
          3. **Explicit force-close** — `-ForceClose` kills the timed-out installer and confirms process exit before setup can unwind and release the lock.
          4. **Single-flight lock** — the exclusive `.setup-lock` FileStream remains open for the complete setup lifetime.
          5. **Regression test** — `test-lock.ps1` parses the setup source, proves the exclusive handle lifecycle, verifies stale-file recovery, and exercises timeout followed immediately by a second acquisition attempt; the second run must remain blocked until the simulated installer exits. The child signals only after its exclusive handle is open, so the proof has no startup timing race.

          ## Evidence discipline
          The previous revision overstated its evidence by referring to `test-lock.ps1` when that file was not present and by treating a lock-handle test as proof of the installer-timeout lifecycle. This revision corrects both errors. The stale generated `.diff` has been removed rather than retained as conflicting evidence.

          ## Run the regression
          ```powershell
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\test-lock.ps1
          pwsh -NoProfile -File .\\test-lock.ps1
          ```
          '''
          Path("PATCH-NOTES-safe-setup-idempotency.md").write_text(textwrap.dedent(notes), encoding="utf-8", newline="\n")

          stale = Path("docs-safe-setup-idempotency.diff")
          if not stale.exists():
              raise SystemExit("expected stale diff is missing")
          stale.unlink()

          runtime = Path(".github/workflows/creation-pr4-repair-runtime.yml")
          if not runtime.exists():
              raise SystemExit("runtime self-removal target is missing")
          runtime.unlink()

          final = setup.read_text(encoding="utf-8")
          required = [
              "continuing to wait while the setup lock remains held",
              "$process.Kill()\n                        $process.WaitForExit()",
          ]
          forbidden = [
              "leaving it running detached to finish safely",
              "It was NOT killed; wait for completion and re-run setup",
          ]
          for item in required:
              if item not in final:
                  raise SystemExit(f"missing required repair fragment: {item}")
          for item in forbidden:
              if item in final:
                  raise SystemExit(f"stale behavior remains: {item}")

      - name: Windows PowerShell 5.1 regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\test-lock.ps1

      - name: PowerShell 7 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\test-lock.ps1

      - name: Commit and deploy correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "jeff"
          git config user.email "jeff@dankscalibur.com"
          git add -A
          $message = @"
          fix(setup): keep lock held through installer timeout

          I’m sorry for overstating the prior proof. I said test-lock.ps1 was included when it was not, and I treated the earlier lock-handle check as if it covered the installer-timeout lifecycle when it did not.

          This correction keeps .setup-lock held until the installer actually exits after the soft timeout, confirms exit on -ForceClose, adds the requested timeout/immediate-second-run regression, removes the stale .diff, and updates the evidence notes.

          Maintainer feedback: https://github.com/xP3ta/hermes-setup/pull/4#issuecomment-5446549624
          Proof: Windows PowerShell 5.1 + PowerShell 7 test-lock.ps1 must pass in this runtime before this commit is created.
          "@
          git commit -m $message
          git push origin HEAD:patch/safe-setup-idempotency
